<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solnado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #222;
      --text: #e5e5e5;
      --muted: #666;
      --dim: #333;
      --accent: #3d5a3d;
      --green: #4a7c4a;
      --red: #8b3a3a;
    }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .tagline {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }
    .warning {
      background: rgba(139, 88, 58, 0.15);
      border: 1px solid #5a4a3d;
      color: #b89a7a;
      padding: 12px;
      border-radius: 4px;
      font-size: 11px;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--dim); }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: var(--green); }
    .hint {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 16px;
    }
    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
    }
    .status-info {
      background: rgba(74, 124, 74, 0.1);
      border: 1px solid var(--accent);
      color: var(--green);
    }
    .status-success {
      background: rgba(74, 124, 74, 0.15);
      border: 1px solid var(--green);
      color: #7ab87a;
    }
    .status-error {
      background: rgba(139, 58, 58, 0.15);
      border: 1px solid var(--red);
      color: #c27474;
    }
    .status a { color: inherit; }
    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--dim);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      color: var(--dim);
      font-size: 12px;
    }
    .step.active { color: var(--text); }
    .step.done { color: var(--green); }
    .step-num {
      width: 20px;
      height: 20px;
      border: 1px solid currentColor;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
    }
    .step.done .step-num {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }
    .footer {
      margin-top: 40px;
      font-size: 10px;
      color: var(--dim);
    }
    .footer a { color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send SOL</h1>
    <p class="tagline">privacy where money-privacy doesn't reach</p>

    <div class="warning">
      Your private key is sent to the server to generate ZK proofs.
      This breaks the sender-recipient link on-chain.
    </div>

    <div class="form-group">
      <label>Your Private Key</label>
      <input type="password" id="privateKey" placeholder="Base58 encoded private key">
    </div>

    <div class="form-group">
      <label>Amount (SOL)</label>
      <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01">
    </div>

    <div class="form-group">
      <label>Recipient Address</label>
      <input type="text" id="recipient" placeholder="Solana wallet address">
    </div>

    <button class="btn" id="sendBtn" onclick="sendPrivately()">
      Send privately
    </button>

    <p class="hint">~0.002 SOL relayer fee deducted from amount</p>

    <div class="steps" id="steps" style="display: none;">
      <div class="step" id="step1">
        <span class="step-num">1</span>
        <span>Depositing to shielded pool</span>
      </div>
      <div class="step" id="step2">
        <span class="step-num">2</span>
        <span>Generating ZK proof</span>
      </div>
      <div class="step" id="step3">
        <span class="step-num">3</span>
        <span>Withdrawing to recipient</span>
      </div>
    </div>

    <div id="status"></div>
  </div>

  <div class="footer">
    <a href="https://github.com/solnadocash/solnado" target="_blank">github</a>
  </div>

  <script>
    function showStatus(msg, type) {
      document.getElementById('status').innerHTML = 
        `<div class="status status-${type}">${msg}</div>`;
    }

    function setStep(n, state) {
      document.getElementById('steps').style.display = 'block';
      for (let i = 1; i <= 3; i++) {
        const el = document.getElementById('step' + i);
        el.classList.remove('active', 'done');
        if (i < n) el.classList.add('done');
        else if (i === n) el.classList.add(state === 'done' ? 'done' : 'active');
      }
    }

    async function sendPrivately() {
      const privateKey = document.getElementById('privateKey').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const recipient = document.getElementById('recipient').value.trim();
      const btn = document.getElementById('sendBtn');

      if (!privateKey) {
        showStatus('Enter your private key', 'error');
        return;
      }
      if (!amount || amount < 0.01) {
        showStatus('Minimum 0.01 SOL', 'error');
        return;
      }
      if (!recipient || recipient.length < 32) {
        showStatus('Enter valid recipient address', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Processing...';
      document.getElementById('status').innerHTML = '';
      setStep(1, 'active');

      try {
        // Start the private send
        const res = await fetch('/api/private-send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senderPrivateKey: privateKey,
            recipientAddress: recipient,
            amountSol: amount
          })
        });

        const { txId, error } = await res.json();
        if (error) throw new Error(error);

        // Poll for status
        let complete = false;
        while (!complete) {
          await new Promise(r => setTimeout(r, 2000));
          
          const statusRes = await fetch(`/api/tx/${txId}`);
          const status = await statusRes.json();

          if (status.status === 'depositing') {
            setStep(1, 'active');
            showStatus('Depositing to shielded pool...', 'info');
          } else if (status.status === 'withdrawing') {
            setStep(1, 'done');
            setStep(2, 'done');
            setStep(3, 'active');
            showStatus('Generating ZK proof and withdrawing...', 'info');
          } else if (status.status === 'complete') {
            setStep(1, 'done');
            setStep(2, 'done');
            setStep(3, 'done');
            showStatus(
              `Sent ${amount} SOL privately!<br>
              <a href="https://solscan.io/tx/${status.depositTx}" target="_blank">Deposit TX</a> | 
              <a href="https://solscan.io/tx/${status.withdrawTx}" target="_blank">Withdraw TX</a>`,
              'success'
            );
            complete = true;
          } else if (status.status === 'failed') {
            throw new Error(status.error || 'Transaction failed');
          }
        }

        // Clear sensitive data
        document.getElementById('privateKey').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('recipient').value = '';

      } catch (err) {
        showStatus(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send privately';
      }
    }
  </script>
</body>
</html>
