<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solnado - Private SOL Transfers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #222;
      --text: #e5e5e5;
      --muted: #666;
      --dim: #333;
      --accent: #3d5a3d;
      --green: #4a7c4a;
      --red: #8b3a3a;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 18px;
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .tagline {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 28px;
      letter-spacing: 0.5px;
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .balance-row:last-of-type {
      margin-bottom: 20px;
    }

    .balance-label {
      color: var(--muted);
    }

    .balance-value {
      color: var(--text);
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    input::placeholder {
      color: var(--dim);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      letter-spacing: 0.5px;
      transition: background 0.15s;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn:hover:not(:disabled) {
      background: var(--green);
    }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--dim);
    }

    .hint {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      margin-top: 16px;
      letter-spacing: 0.3px;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
    }

    .status-info {
      background: rgba(74, 124, 74, 0.1);
      border: 1px solid var(--accent);
      color: var(--green);
    }

    .status-success {
      background: rgba(74, 124, 74, 0.15);
      border: 1px solid var(--green);
      color: #7ab87a;
    }

    .status-error {
      background: rgba(139, 58, 58, 0.15);
      border: 1px solid var(--red);
      color: #c27474;
    }

    .status a {
      color: inherit;
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--dim);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      margin-top: 40px;
      font-size: 10px;
      color: var(--dim);
      text-align: center;
    }

    .footer a {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Send SOL</h1>
    <p class="tagline">privacy where money-privacy doesn't reach</p>

    <div class="balance-row">
      <span class="balance-label">Wallet balance</span>
      <span class="balance-value" id="walletBalance">-- SOL</span>
    </div>
    <div class="balance-row">
      <span class="balance-label">Private balance</span>
      <span class="balance-value" id="privateBalance">-- SOL</span>
    </div>

    <div id="connectSection">
      <button class="btn" id="connectBtn" onclick="connectWallet()">
        Connect Wallet
      </button>
    </div>

    <div id="sendSection" style="display: none;">
      <div class="form-group">
        <label>Amount (SOL)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01">
      </div>

      <div class="form-group">
        <label>Recipient address</label>
        <input type="text" id="recipient" placeholder="Solana address">
      </div>

      <button class="btn" id="sendBtn" onclick="sendPrivate()">
        Send privately
      </button>

      <p class="hint">Funds are protected by default</p>
    </div>

    <div id="status"></div>
  </div>

  <div class="footer">
    <a href="https://github.com/solnadocash/solnado" target="_blank">github</a>
  </div>

  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script>
    const RPC_ENDPOINTS = [
      'https://api.mainnet-beta.solana.com',
      'https://solana-api.projectserum.com'
    ];
    let currentRpcIndex = 0;
    let walletAddress = null;

    function getConnection() {
      return new solanaWeb3.Connection(RPC_ENDPOINTS[currentRpcIndex], 'confirmed');
    }

    function showStatus(msg, type) {
      document.getElementById('status').innerHTML = 
        `<div class="status status-${type}">${msg}</div>`;
    }

    async function connectWallet() {
      const btn = document.getElementById('connectBtn');
      
      if (!window.solana || !window.solana.isPhantom) {
        showStatus('Phantom wallet not found. Please install it.', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connecting...';

      try {
        const resp = await window.solana.connect();
        walletAddress = resp.publicKey.toString();
        
        document.getElementById('connectSection').style.display = 'none';
        document.getElementById('sendSection').style.display = 'block';
        
        await updateBalance();
        showStatus('Wallet connected', 'success');
        
        // Poll balance
        setInterval(updateBalance, 15000);
        
      } catch (err) {
        showStatus('Connection rejected', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Connect Wallet';
      }
    }

    async function updateBalance() {
      if (!walletAddress) return;
      
      try {
        const connection = getConnection();
        const pubkey = new solanaWeb3.PublicKey(walletAddress);
        const balance = await connection.getBalance(pubkey);
        document.getElementById('walletBalance').textContent = 
          (balance / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4) + ' SOL';
        document.getElementById('privateBalance').textContent = '0.00 SOL';
      } catch (err) {
        // Try next RPC
        currentRpcIndex = (currentRpcIndex + 1) % RPC_ENDPOINTS.length;
      }
    }

    async function sendPrivate() {
      const amount = parseFloat(document.getElementById('amount').value);
      const recipient = document.getElementById('recipient').value.trim();
      const btn = document.getElementById('sendBtn');

      if (!amount || amount < 0.01) {
        showStatus('Minimum amount is 0.01 SOL', 'error');
        return;
      }
      if (!recipient || recipient.length < 32) {
        showStatus('Enter a valid recipient address', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Processing...';
      document.getElementById('status').innerHTML = '';

      try {
        const connection = getConnection();
        const lamports = Math.floor(amount * solanaWeb3.LAMPORTS_PER_SOL);
        
        // Build transaction
        const fromPubkey = new solanaWeb3.PublicKey(walletAddress);
        const toPubkey = new solanaWeb3.PublicKey(recipient);
        
        const tx = new solanaWeb3.Transaction().add(
          solanaWeb3.SystemProgram.transfer({
            fromPubkey,
            toPubkey,
            lamports
          })
        );

        const { blockhash } = await connection.getLatestBlockhash();
        tx.recentBlockhash = blockhash;
        tx.feePayer = fromPubkey;

        showStatus('Requesting signature...', 'info');
        
        // Sign with Phantom
        const signed = await window.solana.signTransaction(tx);
        
        showStatus('Submitting transaction...', 'info');
        
        // Submit
        const signature = await connection.sendRawTransaction(signed.serialize());
        await connection.confirmTransaction(signature, 'confirmed');

        showStatus(
          `Sent ${amount} SOL<br><a href="https://explorer.solana.com/tx/${signature}" target="_blank">View on explorer</a>`,
          'success'
        );

        document.getElementById('amount').value = '';
        document.getElementById('recipient').value = '';
        await updateBalance();

      } catch (err) {
        showStatus(err.message || 'Transaction failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send privately';
      }
    }

    // Auto-connect if already authorized
    if (window.solana && window.solana.isPhantom) {
      window.solana.connect({ onlyIfTrusted: true })
        .then(resp => {
          walletAddress = resp.publicKey.toString();
          document.getElementById('connectSection').style.display = 'none';
          document.getElementById('sendSection').style.display = 'block';
          updateBalance();
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
