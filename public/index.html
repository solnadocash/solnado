<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solnado</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --card: #141414;
      --border: #222;
      --text: #e5e5e5;
      --muted: #666;
      --dim: #333;
      --accent: #3d5a3d;
      --green: #4a7c4a;
      --red: #8b3a3a;
    }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
    }
    .logo { width: 48px; height: 48px; border-radius: 50%; }
    .header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
    h1 { font-size: 18px; font-weight: 500; margin: 0; }
    .header .tagline { margin-bottom: 0; margin-top: 4px; }
    .tagline { color: var(--muted); font-size: 11px; margin-bottom: 24px; }
    .balance-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .balance-row:last-of-type { margin-bottom: 20px; }
    .balance-label { color: var(--muted); }
    .balance-value { color: var(--text); }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--dim); }
    .fee-info {
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn:hover:not(:disabled) { background: var(--green); }
    .hint { text-align: center; font-size: 10px; color: var(--muted); margin-top: 16px; }
    
    /* Transaction Flow Visualization */
    .tx-flow {
      margin-top: 24px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      display: none;
    }
    .tx-flow.active { display: block; }
    .flow-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 0 8px;
    }
    .flow-line {
      position: absolute;
      top: 50%;
      left: 32px;
      right: 32px;
      height: 2px;
      background: var(--border);
      transform: translateY(-50%);
      z-index: 0;
    }
    .flow-progress {
      position: absolute;
      top: 50%;
      left: 32px;
      height: 2px;
      background: var(--green);
      transform: translateY(-50%);
      z-index: 1;
      width: 0;
      transition: width 0.5s ease;
    }
    .flow-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      position: relative;
    }
    .node-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--dim);
      transition: all 0.3s ease;
    }
    .flow-node.active .node-icon {
      border-color: var(--green);
      color: var(--green);
      animation: pulse 1.5s infinite;
    }
    .flow-node.done .node-icon {
      background: var(--green);
      border-color: var(--green);
      color: var(--bg);
    }
    .node-label {
      font-size: 9px;
      color: var(--dim);
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }
    .flow-node.active .node-label { color: var(--green); }
    .flow-node.done .node-label { color: var(--muted); }
    
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 124, 74, 0.4); }
      50% { box-shadow: 0 0 0 8px rgba(74, 124, 74, 0); }
    }
    
    /* Moving dot animation */
    .flow-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--green);
      border-radius: 50%;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      opacity: 0;
      box-shadow: 0 0 8px var(--green);
    }
    .flow-dot.moving {
      opacity: 1;
      animation: moveDot 2s ease-in-out infinite;
    }
    @keyframes moveDot {
      0% { left: 32px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { left: calc(100% - 32px); opacity: 0; }
    }
    
    .tx-status {
      text-align: center;
      margin-top: 16px;
      font-size: 11px;
      color: var(--muted);
      min-height: 20px;
    }
    .tx-status.highlight { color: var(--green); }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
    }
    .status-info { background: rgba(74,124,74,0.1); border: 1px solid var(--accent); color: var(--green); }
    .status-success { background: rgba(74,124,74,0.15); border: 1px solid var(--green); color: #7ab87a; }
    .status-error { background: rgba(139,58,58,0.15); border: 1px solid var(--red); color: #c27474; }
    .status a { color: inherit; }
    
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--dim);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .footer { margin-top: 40px; font-size: 10px; color: var(--dim); }
    .footer a { color: var(--muted); text-decoration: none; }
    .footer a:hover { color: var(--text); }

    @media (max-width: 480px) {
      .card { padding: 24px 20px; }
      .node-label { font-size: 8px; }
      .node-icon { width: 24px; height: 24px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img src="/logo.png" alt="Solnado" class="logo">
      <div>
        <h1>Send SOL</h1>
        <p class="tagline">privacy where money-privacy doesn't reach</p>
      </div>
    </div>

    <div class="balance-row">
      <span class="balance-label">Wallet balance</span>
      <span class="balance-value" id="walletBalance">-- SOL</span>
    </div>
    <div class="balance-row">
      <span class="balance-label">Private balance</span>
      <span class="balance-value" id="privateBalance">0.00 SOL</span>
    </div>

    <div id="connectSection">
      <button class="btn" id="connectBtn" onclick="connectWallet()">
        Connect Wallet
      </button>
    </div>

    <div id="sendSection" style="display: none;">
      <div class="form-group">
        <label>Amount (SOL)</label>
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01">
        <div class="fee-info">Fee: 0.005 SOL</div>
      </div>

      <div class="form-group">
        <label>Recipient Address</label>
        <input type="text" id="recipient" placeholder="Solana wallet address">
      </div>

      <button class="btn" id="sendBtn" onclick="sendPrivately()">
        Send privately
      </button>

      <p class="hint">Funds are protected by default</p>
    </div>

    <!-- Transaction Flow Visualization -->
    <div class="tx-flow" id="txFlow">
      <div class="flow-container">
        <div class="flow-line"></div>
        <div class="flow-progress" id="flowProgress"></div>
        <div class="flow-dot" id="flowDot"></div>
        
        <div class="flow-node" id="node1">
          <div class="node-icon">W</div>
          <span class="node-label">Wallet</span>
        </div>
        <div class="flow-node" id="node2">
          <div class="node-icon">R</div>
          <span class="node-label">Relayer</span>
        </div>
        <div class="flow-node" id="node3">
          <div class="node-icon">S</div>
          <span class="node-label">Shield</span>
        </div>
        <div class="flow-node" id="node4">
          <div class="node-icon">+</div>
          <span class="node-label">Recipient</span>
        </div>
      </div>
      <div class="tx-status" id="txStatus"></div>
    </div>

    <div id="status"></div>
  </div>

  <div class="footer">
    <a href="https://x.com/solnadocash" target="_blank">twitter</a>
    <span style="color: var(--dim);">|</span>
    <a href="https://github.com/solnadocash/solnado" target="_blank">github</a>
    <span style="color: var(--dim);">|</span>
    <a href="/docs">docs</a>
  </div>

  <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
  <script>
    const RPC_URL = 'https://mainnet.helius-rpc.com/?api-key=da8de8e3-afd3-457e-9820-a62102ca3c9b';
    let walletAddress = null;
    let connection = null;

    function showStatus(msg, type) {
      document.getElementById('status').innerHTML = `<div class="status status-${type}">${msg}</div>`;
    }

    function setFlowStep(step, statusText) {
      const flow = document.getElementById('txFlow');
      const progress = document.getElementById('flowProgress');
      const dot = document.getElementById('flowDot');
      const txStatus = document.getElementById('txStatus');
      
      flow.classList.add('active');
      txStatus.textContent = statusText;
      txStatus.classList.toggle('highlight', step > 0 && step < 5);
      
      // Reset all nodes
      for (let i = 1; i <= 4; i++) {
        const node = document.getElementById('node' + i);
        node.classList.remove('active', 'done');
        if (i < step) node.classList.add('done');
        else if (i === step) node.classList.add('active');
      }
      
      // Progress bar width (0%, 33%, 66%, 100%)
      const progressPercent = Math.max(0, (step - 1) * 33.33);
      progress.style.width = progressPercent + '%';
      
      // Show moving dot during active transfer
      if (step > 0 && step < 5) {
        dot.classList.add('moving');
      } else {
        dot.classList.remove('moving');
      }
    }

    function hideFlow() {
      document.getElementById('txFlow').classList.remove('active');
      document.getElementById('flowDot').classList.remove('moving');
    }

    async function connectWallet() {
      const btn = document.getElementById('connectBtn');
      if (!window.solana?.isPhantom) {
        showStatus('Install Phantom wallet', 'error');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Connecting...';
      try {
        const resp = await window.solana.connect();
        walletAddress = resp.publicKey.toString();
        connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
        document.getElementById('connectSection').style.display = 'none';
        document.getElementById('sendSection').style.display = 'block';
        await updateBalance();
        setInterval(updateBalance, 15000);
      } catch (err) {
        showStatus('Connection rejected', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Connect Wallet';
      }
    }

    async function updateBalance() {
      if (!walletAddress || !connection) return;
      try {
        const balance = await connection.getBalance(new solanaWeb3.PublicKey(walletAddress));
        document.getElementById('walletBalance').textContent = 
          (balance / solanaWeb3.LAMPORTS_PER_SOL).toFixed(4) + ' SOL';
      } catch (err) {
        console.error('Balance error:', err);
      }
    }

    async function sendPrivately() {
      const amount = parseFloat(document.getElementById('amount').value);
      const recipient = document.getElementById('recipient').value.trim();
      const btn = document.getElementById('sendBtn');

      if (!amount || amount < 0.01) {
        showStatus('Minimum 0.01 SOL', 'error');
        return;
      }
      if (!recipient || recipient.length < 32) {
        showStatus('Enter valid recipient address', 'error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Processing...';
      document.getElementById('status').innerHTML = '';

      try {
        // Step 1: Wallet -> Relayer
        setFlowStep(1, 'Preparing transaction...');

        const prepRes = await fetch('/api/prepare-deposit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            senderAddress: walletAddress,
            recipientAddress: recipient,
            amountSol: amount
          })
        });

        const prepData = await prepRes.json();
        if (prepData.error) throw new Error(prepData.error);

        // Sign with Phantom
        setFlowStep(1, 'Sign in wallet...');
        
        const txBytes = Uint8Array.from(atob(prepData.unsignedTx), c => c.charCodeAt(0));
        const tx = solanaWeb3.Transaction.from(txBytes);
        
        const signed = await window.solana.signTransaction(tx);
        const signedBase64 = btoa(String.fromCharCode(...signed.serialize()));

        // Step 2: Relayer received
        setFlowStep(2, 'Sending to relayer...');

        const submitRes = await fetch('/api/submit-deposit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            signedTx: signedBase64,
            sessionId: prepData.sessionId
          })
        });

        const submitData = await submitRes.json();
        if (submitData.error) throw new Error(submitData.error);

        // Poll for completion
        let complete = false;
        while (!complete) {
          await new Promise(r => setTimeout(r, 2000));
          
          const statusRes = await fetch(`/api/status/${prepData.sessionId}`);
          const status = await statusRes.json();

          if (status.step === 'depositing') {
            setFlowStep(2, 'Relayer processing...');
          } else if (status.step === 'shielding') {
            setFlowStep(3, 'Shielding funds...');
          } else if (status.step === 'withdrawing') {
            setFlowStep(4, 'Withdrawing to recipient...');
          } else if (status.step === 'complete') {
            setFlowStep(5, 'Complete');
            setTimeout(() => {
              hideFlow();
              showStatus(
                `Sent ${amount} SOL privately<br>
                <a href="https://solscan.io/tx/${status.depositTx}" target="_blank">View deposit</a> · 
                <a href="https://solscan.io/tx/${status.withdrawTx}" target="_blank">View withdraw</a>`,
                'success'
              );
            }, 1500);
            complete = true;
          } else if (status.step === 'failed') {
            throw new Error(status.error || 'Transfer failed');
          }
        }

        document.getElementById('amount').value = '';
        document.getElementById('recipient').value = '';
        await updateBalance();

      } catch (err) {
        hideFlow();
        showStatus(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Send privately';
      }
    }

    // Auto-connect
    if (window.solana?.isPhantom) {
      window.solana.connect({ onlyIfTrusted: true })
        .then(resp => {
          walletAddress = resp.publicKey.toString();
          connection = new solanaWeb3.Connection(RPC_URL, 'confirmed');
          document.getElementById('connectSection').style.display = 'none';
          document.getElementById('sendSection').style.display = 'block';
          updateBalance();
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
